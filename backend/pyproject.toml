[project]
name = "rutrackarr"
version = "0.1.0"
description = "Torznab indexer for RuTracker with language-aware release ranking for Sonarr and Radarr"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "httpx>=0.28",
  "selectolax>=0.4",
  "sqlalchemy>=2.0",
  "alembic>=1.17",
  "pydantic-settings>=2.11",
  "cryptography>=46",
  "argon2-cffi>=25.1",
  "itsdangerous>=2.2",
]

[project.scripts]
rutrackarr = "rutrackarr.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "respx>=0.22",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rutrackarr"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
# RUF001-003: Cyrillic letters that look like Latin ones are expected here.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"tests/fixtures/**" = ["E501"]  # verbatim HTML rows

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
